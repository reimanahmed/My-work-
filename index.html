
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REMAN HASAN — Creative Director & Digital Artist</title>
    <!-- Google Fonts: Cormorant Garamond for editorial headings, Plus Jakarta Sans for refined body copy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           1. DESIGN SYSTEM & TOKENS
           ========================================== */
        :root {
            --bg-ivory: #FAF7F2;
            --bg-blush: #F4ECE6;
            --rose-dusty: #C49A90;
            --mauve-soft: #9E858B;
            --lavender-pale: #E6E1E8;
            --champagne: #DFD3C3;
            --charcoal: #2A2527;
            --gold-accent: #B8977E;
            
            --font-editorial: 'Cormorant Garamond', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
            --shadow-subtle: 0 10px 40px -10px rgba(42, 37, 39, 0.06);
            --shadow-hover: 0 20px 60px -15px rgba(196, 154, 144, 0.2);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            background-color: var(--bg-ivory);
            color: var(--charcoal);
            font-family: var(--font-sans);
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================
           2. NAVIGATION
           ========================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background: rgba(250, 247, 242, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(223, 211, 195, 0.3);
            transition: padding 0.4s var(--transition-smooth);
        }

        header.scrolled {
            padding: 1rem 2rem;
            background: rgba(250, 247, 242, 0.95);
            box-shadow: var(--shadow-subtle);
        }

        .logo {
            font-family: var(--font-editorial);
            font-size: 1.35rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--charcoal);
            text-decoration: none;
        }

        .nav-links {
            display: none;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--charcoal);
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--rose-dusty);
            transition: width 0.3s var(--transition-smooth);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 5px;
        }

        .menu-btn span {
            display: block;
            width: 24px;
            height: 1px;
            background-color: var(--charcoal);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* ==========================================
           3. HERO SECTION & BOTANICAL CANVAS
           ========================================== */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8rem 1.5rem 4rem 1.5rem;
            overflow: hidden;
            background: radial-gradient(circle at 70% 30%, var(--bg-blush) 0%, var(--bg-ivory) 70%);
        }

        /* Botanical overlay elements simulating 3D depth and rose petals */
        .botanical-bg-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-petal {
            position: absolute;
            background: linear-gradient(135deg, rgba(196, 154, 144, 0.3), rgba(230, 225, 232, 0.4));
            border-radius: 50% 0 50% 50%;
            filter: blur(1px);
            animation: floatPetal 12s infinite ease-in-out;
        }

        .petal-1 { width: 40px; height: 60px; top: 15%; left: 10%; transform: rotate(25deg); animation-delay: 0s; }
        .petal-2 { width: 30px; height: 45px; top: 70%; left: 85%; transform: rotate(-40deg); animation-delay: 3s; }
        .petal-3 { width: 55px; height: 80px; top: 30%; right: 12%; transform: rotate(15deg); animation-delay: 1.5s; }

        @keyframes floatPetal {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.6; }
            50% { transform: translateY(-25px) rotate(10deg) scale(1.05); opacity: 0.9; }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 800px;
        }

        .hero-tag {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--rose-dusty);
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(196, 154, 144, 0.3);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            animation: fadeInDown 1s var(--transition-smooth);
        }

        .hero h1 {
            font-family: var(--font-editorial);
            font-size: clamp(2.8rem, 7vw, 6rem);
            font-weight: 300;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            color: var(--charcoal);
            animation: fadeInUp 1s var(--transition-smooth) 0.2s both;
        }

        .hero h1 em {
            font-style: italic;
            color: var(--rose-dusty);
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--mauve-soft);
            max-width: 550px;
            margin: 0 auto 2.5rem auto;
            animation: fadeInUp 1s var(--transition-smooth) 0.4s both;
        }

        .hero-cta-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            animation: fadeInUp 1s var(--transition-smooth) 0.6s both;
        }

        .btn-luxury {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 2.5rem;
            background-color: var(--charcoal);
            color: var(--bg-ivory);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.4s var(--transition-smooth);
            border: 1px solid var(--charcoal);
            position: relative;
            overflow: hidden;
        }

        .btn-luxury:hover {
            background-color: var(--rose-dusty);
            border-color: var(--rose-dusty);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .btn-outline {
            background: transparent;
            color: var(--charcoal);
            border: 1px solid var(--champagne);
        }

        .btn-outline:hover {
            background: var(--champagne);
            border-color: var(--champagne);
            color: var(--charcoal);
        }

        /* ==========================================
           4. CURATED GALLERY / PORTFOLIO SECTION
           ========================================== */
        .section-padding {
            padding: 7rem 1.5rem;
        }

        .section-header {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 4rem auto;
        }

        .section-subtitle {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--rose-dusty);
            margin-bottom: 1rem;
            display: block;
        }

        .section-header h2 {
            font-family: var(--font-editorial);
            font-size: clamp(2.2rem, 4vw, 3.5rem);
            font-weight: 300;
            line-height: 1.2;
            color: var(--charcoal);
        }

        .portfolio-grid {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
        }

        .project-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.5s var(--transition-smooth), box-shadow 0.5s var(--transition-smooth);
            cursor: pointer;
            position: relative;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .project-image-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            overflow: hidden;
            background-color: var(--bg-blush);
        }

        /* Botanical placeholder art styling simulating realistic floral photography and editorial direction */
        .botanical-art-1 {
            background: radial-gradient(circle at 30% 40%, #E8D4CC 0%, #C49A90 50%, #5E4347 100%);
        }
        .botanical-art-2 {
            background: radial-gradient(circle at 70% 60%, #E6E1E8 0%, #9E858B 50%, #403438 100%);
        }
        .botanical-art-3 {
            background: radial-gradient(circle at 50% 30%, #F4ECE6 0%, #DFD3C3 50%, #6E5F52 100%);
        }

        .project-image-wrapper img, .project-graphic {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s var(--transition-smooth);
        }

        .project-card:hover .project-graphic {
            transform: scale(1.05);
        }

        .project-meta {
            padding: 2rem;
            background: white;
        }

        .project-category {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--rose-dusty);
            margin-bottom: 0.5rem;
            display: block;
        }

        .project-title {
            font-family: var(--font-editorial);
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 0.75rem;
            color: var(--charcoal);
